[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aio-surfaces"
version = "0.2.1"
description = "Generate llms.txt, aeo.json, entity.json, and brand.json from a single site config — AI citation engineering for static + dynamic sites."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Joseph W. Anady", email = "admin@thatdeveloperguy.com"},
]
keywords = [
    "ai",
    "seo",
    "aeo",
    "aio",
    "llms.txt",
    "schema.org",
    "structured-data",
    "answer-engine-optimization",
    "generative-engine-optimization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
test = ["pytest>=8.0", "PyYAML>=6.0"]

[project.scripts]
aio-surfaces = "aio_surfaces.cli:main"

[project.urls]
Homepage = "https://www.thatdevpro.com/open-source/aio-surfaces/"
Repository = "https://github.com/Janady13/aio-surfaces"
Issues = "https://github.com/Janady13/aio-surfaces/issues"

[tool.setuptools]
packages = ["aio_surfaces"]
